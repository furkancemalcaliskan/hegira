[package]
name = "storage"
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
aws-config = { version = "1.8.18", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"], optional = true }
aws-sdk-s3 = { version = "1.144.0", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
# aws-smithy-json 0.63.0 is not source-compatible with aws-smithy-types 1.7.0.
# Keep fresh validation locks on the release-verified Smithy API generation.
aws-smithy-types = { version = "=1.6.3", optional = true }
tokio = { version = "1.52.3", features = ["fs"] }

[features]
default = []
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:aws-smithy-types"]

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt"] }
