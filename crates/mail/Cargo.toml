[package]
name = "mail"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
background_jobs = { path = "../background_jobs" }
lettre = { version = "0.11.22", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.44"

[features]
default = []
smtp = ["dep:lettre"]
