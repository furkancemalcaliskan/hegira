[package]
name = "presentation"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
application = { path = "../application", features = ["ssr"] }
application_contracts = { path = "../application_contracts" }
axum = "0.8.9"
chrono = { version = "0.4.44", features = ["serde"] }
cookie = "0.18.1"
domain_shared = { path = "../domain_shared" }
infrastructure = { path = "../infrastructure", default-features = false, features = ["ssr"] }
leptos_axum = "0.8.9"
leptos_support = { path = "../leptos_support", features = ["ssr"] }
observability = { path = "../observability", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "fs", "signal", "time"] }
tower = "0.5.3"
tracing = "0.1.44"
utoipa = { version = "5.4.0", features = ["chrono", "uuid"], optional = true }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"], optional = true }
uuid = { version = "1.23.2", features = ["v4", "serde", "js"] }

[features]
default = ["db-postgres", "db-sqlite"]
db-postgres = ["infrastructure/db-postgres"]
db-sqlite = ["infrastructure/db-sqlite"]
ssr = []
openapi = ["dep:utoipa", "dep:utoipa-swagger-ui", "application_contracts/openapi"]
metrics-prometheus = ["observability/metrics-prometheus"]

[dev-dependencies]
http-body-util = "0.1.3"
