[package]
name = "search"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
background_jobs = { path = "../background_jobs" }
chrono = { version = "0.4.44", features = ["serde"], optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "chrono", "uuid"], optional = true }
tokio = { version = "1.52.3", features = ["rt", "time"], optional = true }
tracing = "0.1.44"
uuid = { version = "1.23.2", features = ["v4", "serde"] }

[features]
default = []
db-postgres = ["dep:sqlx", "sqlx/postgres"]
db-sqlite = ["dep:chrono", "dep:sqlx", "sqlx/sqlite"]
meilisearch = ["dep:reqwest", "dep:tokio"]

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt"] }
