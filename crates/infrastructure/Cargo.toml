[package]
name = "infrastructure"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
application = { path = "../application" }
application_contracts = { path = "../application_contracts" }
background_jobs = { path = "../background_jobs" }
cache = { path = "../cache", default-features = false }
configuration = { path = "../configuration" }
argon2 = "0.5.3"
base64 = "0.23.0"
chrono = { version = "0.4.44", features = ["serde"] }
domain = { path = "../domain" }
domain_shared = { path = "../domain_shared" }
hmac = "0.13.0"
identity_sqlx = { path = "../../modules/identity/sqlx", default-features = false, optional = true }
ipnet = "2.12.0"
platform_core = { path = "../platform_core" }
persistence = { path = "../persistence", default-features = false }
redis = { version = "1.2.3", features = ["tokio-comp"], optional = true }
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "migrate", "chrono", "uuid"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "fs", "signal"] }
tracing = "0.1.44"
runtime = { path = "../runtime" }
uuid = { version = "1.23.2", features = ["v4", "serde", "js"] }

[dev-dependencies]
axum = "0.8.9"

[features]
default = ["db-postgres", "db-sqlite"]
db-postgres = ["background_jobs/db-postgres", "dep:identity_sqlx", "identity_sqlx/db-postgres", "persistence/db-postgres", "sqlx/postgres"]
db-sqlite = ["background_jobs/db-sqlite", "dep:identity_sqlx", "identity_sqlx/db-sqlite", "persistence/db-sqlite", "sqlx/sqlite"]
ssr = []
cache-redis = ["cache/redis", "dep:redis"]
