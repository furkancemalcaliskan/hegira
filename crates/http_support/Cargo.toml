[package]
name = "http_support"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
axum = "0.8.9"
ipnet = "2.12.0"
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry-http = { version = "0.32.0", optional = true }
redis = { version = "1.2.3", features = ["tokio-comp"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.33.0", optional = true }
url = "2.5.7"
uuid = { version = "1.23.2", features = ["v4"] }

[features]
default = []
cache-redis = ["dep:redis"]
otel-otlp = ["dep:opentelemetry", "dep:opentelemetry-http", "dep:tracing-opentelemetry"]

[dev-dependencies]
http-body-util = "0.1.3"
opentelemetry_sdk = { version = "0.32.0", features = ["trace"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tower = "0.5.3"
