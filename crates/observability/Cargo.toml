[package]
name = "observability"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
axum = "0.8.9"
background_jobs = { path = "../background_jobs", optional = true }
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "grpc-tonic", "http-proto", "reqwest-blocking-client", "tls-ring", "tls-roots"], optional = true }
opentelemetry_sdk = { version = "0.32.0", features = ["trace", "rt-tokio"], optional = true }
prometheus = { version = "0.14.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["time"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.33.0", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
default = []
metrics-prometheus = ["dep:background_jobs", "dep:prometheus"]
otel-otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]

[dev-dependencies]
http-body-util = "0.1.3"
serde_json = "1.0.145"
tower = "0.5.3"
