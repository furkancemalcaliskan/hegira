[package]
name = "application_contracts"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
domain = { path = "../domain" }
domain_shared = { path = "../domain_shared" }
serde = { version = "1.0.228", features = ["derive"] }
utoipa = { version = "5.4.0", features = ["chrono", "uuid"], optional = true }
uuid = { version = "1.23.2", features = ["v4", "serde", "js"] }

[features]
openapi = ["dep:utoipa"]
