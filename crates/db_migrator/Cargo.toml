[package]
name = "db_migrator"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "db_migrator"
path = "src/main.rs"

[dependencies]
infrastructure = { path = "../infrastructure", optional = true, default-features = false }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"], optional = true }

[features]
default = ["db-postgres", "db-sqlite"]
db-postgres = ["infrastructure/db-postgres"]
db-sqlite = ["infrastructure/db-sqlite"]
ssr = ["dep:infrastructure", "dep:tokio", "infrastructure/ssr"]
search-meilisearch = ["ssr", "infrastructure/search-meilisearch"]
