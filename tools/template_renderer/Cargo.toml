[package]
name = "template_renderer"
description = "Deterministic application template rendering for the Hegira full-stack application framework"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.96"

[dependencies]
application_manifest = { path = "../../crates/application_manifest" }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
toml = "1.1.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
