[package]
name = "template_renderer"
description = "Deterministic application template rendering for the Hegira full-stack application framework"
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.96"

[dependencies]
application_manifest = { path = "../../crates/application_manifest" }
application_mutator = { path = "../application_mutator" }
serde = { version = "1.0.228", features = ["derive"] }
semver = "1.0.27"
sha2 = "0.11.0"
toml = "1.1.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
resource_generator = { path = "../resource_generator" }
serde_json = "1.0.149"
upgrade_test_support = { path = "../upgrade_test_support" }
