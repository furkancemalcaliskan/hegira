[package]
name = "application_mutator"
description = "Deterministic planning and failure-safe publication for existing Hegira applications"
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.96"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
toml_edit = "0.25.13"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
serde_json = "1.0.149"
