[package]
name = "hegira_cli"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.96"

[[bin]]
name = "hegira"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", default-features = false, features = [
  "derive",
  "error-context",
  "help",
  "std",
  "suggestions",
  "usage",
] }
