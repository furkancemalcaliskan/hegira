[package]
name = "hegira_cli"
description = "Source-runnable application creation CLI for the Hegira full-stack application framework"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.96"

[[bin]]
name = "hegira"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", default-features = false, features = [
  "derive",
  "error-context",
  "help",
  "std",
  "suggestions",
  "usage",
] }
template_renderer = { path = "../template_renderer" }
