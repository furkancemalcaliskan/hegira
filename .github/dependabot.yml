version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /crates/web/src
    schedule:
      interval: weekly
    groups:
      frontend-tooling:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Version-like refs select the Rust compiler, not the action implementation.
      # Keep this aligned with rust-toolchain.toml and update both intentionally.
      - dependency-name: dtolnay/rust-toolchain
