name: production-container-smoke

on:
  push:
    branches:
      - develop
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/container-smoke.yml"
      - ".cargo/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "config/production.yaml"
      - "crates/**"
      - "docker-compose.smoke.yml"
      - "rust-toolchain.toml"
      - "scripts/container-smoke.sh"
  pull_request:
    branches:
      - develop
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/container-smoke.yml"
      - ".cargo/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "config/production.yaml"
      - "crates/**"
      - "docker-compose.smoke.yml"
      - "rust-toolchain.toml"
      - "scripts/container-smoke.sh"
  workflow_dispatch:

concurrency:
  group: production-container-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build and verify the disposable production stack
        run: sh scripts/container-smoke.sh
