name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos@0.3.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/web/src/package-lock.json
      - run: npm ci
        working-directory: crates/web/src
      - name: Build PostgreSQL release bundle
        run: >-
          cargo leptos build --release
          --bin-features ssr,db-postgres
          --lib-features hydrate
      - name: Package release
        run: |
          mkdir -p dist/bundle
          cp target/release/hegira dist/bundle/
          cp -R target/site dist/bundle/site
          cp LICENSE.txt README.md dist/bundle/
          tar -C dist/bundle -czf "dist/hegira-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" .
          sha256sum "dist/hegira-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" > "dist/hegira-${GITHUB_REF_NAME}-linux-x86_64.tar.gz.sha256"
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/hegira-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/hegira-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/hegira-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256
            dist/hegira-${{ github.ref_name }}.spdx.json
