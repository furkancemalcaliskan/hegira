name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Stable release ref matching every workspace package version
        required: true

concurrency:
  group: release-${{ inputs.release_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}
    outputs:
      release_ref: ${{ steps.release-identity.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.1
      - id: release-identity
        name: Verify release identity
        run: |
          sh scripts/release-policy.sh "$RELEASE_REF"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF_TYPE" = "tag"
            test "$(git cat-file -t "$GITHUB_REF")" = "tag"
            test "$(git rev-parse "$GITHUB_REF^{}")" = "$(git rev-parse HEAD)"
          else
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            test "$GITHUB_REF" = "refs/heads/main"
          fi
          echo "value=$RELEASE_REF" >>"$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - name: Generate source SBOM from the clean checkout
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/hegira-${{ env.RELEASE_REF }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Record and verify source SBOM identity
        env:
          RELEASE_COMMIT: ${{ steps.release-identity.outputs.commit }}
        run: |
          sbom="$RUNNER_TEMP/hegira-$RELEASE_REF.spdx.json"
          annotated="$sbom.tmp"
          identity="Hegira source SBOM for $RELEASE_REF at commit $RELEASE_COMMIT."
          jq --arg identity "$identity" \
            '.documentComment = $identity' "$sbom" >"$annotated"
          mv "$annotated" "$sbom"
          jq -e --arg identity "$identity" '
            (.spdxVersion | startswith("SPDX-")) and
            (.packages | length > 0) and
            (.documentComment == $identity)
          ' "$sbom" >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: hegira-${{ env.RELEASE_REF }}-source-sbom
          path: ${{ runner.temp }}/hegira-${{ env.RELEASE_REF }}.spdx.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  framework:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate application-independent framework packages
        run: sh scripts/framework-check.sh

  official-modules:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: hegira_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hegira_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/hegira_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate official module contracts
        run: WITH_IGNORED_DB_TESTS=true sh scripts/official-modules-check.sh

  tooling:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos@0.3.7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: templates/applications/layered/apps/web/src/package-lock.json
      - name: Validate rendering tooling and canonical application source
        run: sh scripts/layered-template-check.sh
      - name: Validate Hegira CLI command contracts
        run: sh scripts/cli-check.sh

  generated-application:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - name: Validate generated applications and production container
        run: sh scripts/generated-application-check.sh

  publish:
    if: github.event_name == 'push'
    needs:
      - validate
      - framework
      - official-modules
      - tooling
      - generated-application
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REF: ${{ needs.validate.outputs.release_ref }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: hegira-${{ env.RELEASE_REF }}-source-sbom
          path: dist
      - name: Publish immutable source release
        run: |
          gh release create "$RELEASE_REF" \
            "dist/hegira-$RELEASE_REF.spdx.json#Source SPDX SBOM" \
            --verify-tag \
            --title "$RELEASE_REF" \
            --notes-file "docs/releases/$RELEASE_REF.md"
