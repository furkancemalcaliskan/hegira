name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Stable release ref matching every workspace package version
        required: true

concurrency:
  group: release-${{ inputs.release_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}
    outputs:
      release_ref: ${{ steps.release-identity.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.96.1
      - id: release-identity
        name: Verify release identity
        run: |
          sh scripts/release-policy.sh "$RELEASE_REF"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF_TYPE" = "tag"
            test "$(git cat-file -t "$GITHUB_REF")" = "tag"
            test "$(git rev-parse "$GITHUB_REF^{}")" = "$(git rev-parse HEAD)"
          else
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            test "$GITHUB_REF" = "refs/heads/main"
          fi
          echo "value=$RELEASE_REF" >>"$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
      - name: Generate source SBOM from the clean checkout
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/hegira-${{ env.RELEASE_REF }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Record and verify source SBOM identity
        env:
          RELEASE_COMMIT: ${{ steps.release-identity.outputs.commit }}
        run: |
          sbom="$RUNNER_TEMP/hegira-$RELEASE_REF.spdx.json"
          annotated="$sbom.tmp"
          identity="Hegira source SBOM for $RELEASE_REF at commit $RELEASE_COMMIT."
          jq --arg identity "$identity" \
            '.documentComment = $identity' "$sbom" >"$annotated"
          mv "$annotated" "$sbom"
          jq -e --arg identity "$identity" '
            (.spdxVersion | startswith("SPDX-")) and
            (.packages | length > 0) and
            (.documentComment == $identity)
          ' "$sbom" >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: hegira-${{ env.RELEASE_REF }}-source-sbom
          path: ${{ runner.temp }}/hegira-${{ env.RELEASE_REF }}.spdx.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  full-stack:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos@0.3.7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/web/src/package-lock.json
      - name: Verify the full-stack release build
        run: sh scripts/full-stack-build-check.sh

  container-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Verify the production container contract
        run: sh scripts/container-smoke.sh

  publish:
    if: github.event_name == 'push'
    needs:
      - validate
      - full-stack
      - container-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REF: ${{ needs.validate.outputs.release_ref }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: hegira-${{ env.RELEASE_REF }}-source-sbom
          path: dist
      - name: Publish immutable source release
        run: |
          gh release create "$RELEASE_REF" \
            "dist/hegira-$RELEASE_REF.spdx.json#Source SPDX SBOM" \
            --verify-tag \
            --title "Hegira $RELEASE_REF" \
            --notes-file "docs/releases/$RELEASE_REF.md"
