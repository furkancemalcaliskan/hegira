name: backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ssr,db-sqlite
          - ssr,db-postgres
          - hydrate,db-sqlite
          - ssr,db-postgres,openapi,metrics-prometheus,otel-otlp
          - ssr,db-postgres,cache-redis,storage-s3,mailer-smtp,search-meilisearch
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --no-default-features --features "${{ matrix.features }}"

  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hegira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hegira_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hegira_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: WITH_IGNORED_DB_TESTS=true sh scripts/backend-check.sh

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Prove ignored RSA advisory is inactive
        run: test -z "$(cargo tree --locked --target all --all-features -i rsa@0.9.10 2>/dev/null)"
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
