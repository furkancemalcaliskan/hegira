name: backend

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  feature-matrix:
    name: feature-matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sqlite-server
            target_args: ""
            features: ssr,db-sqlite
          - name: postgres-server
            target_args: ""
            features: ssr,db-postgres
          - name: wasm-hydrate
            target_args: --target wasm32-unknown-unknown
            features: hydrate
          - name: observability
            target_args: ""
            features: ssr,db-postgres,openapi,metrics-prometheus,otel-otlp
          - name: distributed-providers
            target_args: ""
            features: ssr,db-postgres,cache-redis,storage-s3,mailer-smtp,search-meilisearch
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo check --locked --no-default-features
          --package hegira
          --features "${{ matrix.features }}"
          ${{ matrix.target_args }}

  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hegira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hegira_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hegira_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: WITH_IGNORED_DB_TESTS=true sh scripts/backend-check.sh

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.1
      - name: Prove ignored RSA advisory is inactive
        run: test -z "$(cargo tree --locked --target all --all-features -i rsa@0.9.10 2>/dev/null)"
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit Rust dependencies
        run: cargo audit --file Cargo.lock
