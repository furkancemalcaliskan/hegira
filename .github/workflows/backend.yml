name: repository-validation

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: repository-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  feature-matrix:
    name: feature-matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sqlite-server
            target: ""
            features: ssr,db-sqlite
          - name: postgres-server
            target: ""
            features: ssr,db-postgres
          - name: wasm-hydrate
            target: wasm32-unknown-unknown
            features: hydrate
          - name: observability
            target: ""
            features: ssr,db-postgres,openapi,metrics-prometheus,otel-otlp
          - name: distributed-providers
            target: ""
            features: ssr,db-postgres,cache-redis,storage-s3,mailer-smtp,search-meilisearch
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Validate generated application feature contract
        run: >-
          sh scripts/generated-feature-check.sh
          "${{ matrix.features }}"
          "${{ matrix.target }}"

  framework:
    name: framework
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate application-independent framework packages
        run: sh scripts/framework-check.sh

  official-modules:
    name: official-modules
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: hegira_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hegira_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/hegira_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate official module contracts
        run: WITH_IGNORED_DB_TESTS=true sh scripts/official-modules-check.sh

  tooling:
    name: tooling
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos@0.3.7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: templates/applications/layered/apps/web/src/package-lock.json
      - name: Validate rendering tooling and canonical application source
        run: sh scripts/layered-template-check.sh
      - name: Validate Hegira CLI command contracts
        run: sh scripts/cli-check.sh

  generated-application:
    name: generated-application (${{ matrix.lifecycle }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - lifecycle: default
            cache_name: generated-application-check
          - lifecycle: identity-added
            cache_name: identity-added-application-check
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: wasm32-unknown-unknown
      - id: source-identity
        name: Resolve immutable source identity
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >>"$GITHUB_OUTPUT"
      - id: generated-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/validation/build/${{ matrix.cache_name }}
          cache-on-failure: false
          key: generated-${{ matrix.lifecycle }}-rust-1.96.1-targets-native-wasm32-profiles-dev-test-release-providers-sqlite-postgres-features-ssr-db-sqlite-db-postgres-hydrate-lock-${{ hashFiles('Cargo.lock', 'templates/applications/layered/Cargo.lock') }}-source-${{ steps.source-identity.outputs.tree }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos@0.3.7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: templates/applications/layered/apps/web/src/package-lock.json
      - name: Report generated-application cache restoration
        run: |
          echo "generated-application cache hit: ${{ steps.generated-cache.outputs.cache-hit }}"
          echo "generated-application cache identity: ${{ matrix.cache_name }}"
          {
            echo "### Generated application cache"
            echo
            echo "- Lifecycle: \`${{ matrix.lifecycle }}\`"
            echo "- Exact cache hit: \`${{ steps.generated-cache.outputs.cache-hit }}\`"
            echo "- Local bounded cache: \`${{ matrix.cache_name }}\`"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Validate ${{ matrix.lifecycle }} lifecycle across development and production
        run: sh scripts/generated-application-check.sh "${{ matrix.lifecycle }}"

  quality:
    name: quality
    if: always()
    needs:
      - framework
      - official-modules
      - tooling
      - generated-application
    runs-on: ubuntu-latest
    steps:
      - name: Require every repository ownership gate
        env:
          FRAMEWORK_RESULT: ${{ needs.framework.result }}
          MODULES_RESULT: ${{ needs.official-modules.result }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          GENERATED_APPLICATION_RESULT: ${{ needs.generated-application.result }}
        run: |
          test "$FRAMEWORK_RESULT" = success
          test "$MODULES_RESULT" = success
          test "$TOOLING_RESULT" = success
          test "$GENERATED_APPLICATION_RESULT" = success

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.1
      - name: Prove ignored RSA advisory is inactive
        run: test -z "$(cargo tree --locked --target all --all-features -i rsa@0.9.10 2>/dev/null)"
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit Rust dependencies
        run: cargo audit --file Cargo.lock
