schema = 2
application = "{{application_name}}"

[framework]
repository = "{{framework_repository}}"
version = "{{framework_version}}"

[selection]
databases = ["{{database_adapter}}"]
clients = ["{{client_adapter}}"]

[composition]
capabilities = ["authentication", "authorization"]

[composition.package]
id = "{{package_id}}"
version = "{{package_version}}"

[[composition.components]]
id = "layered-base"
version = "{{package_version}}"

[[composition.components]]
id = "{{component_id}}"
version = "{{package_version}}"

[[composition.modules]]
id = "identity"
version = "{{package_version}}"
