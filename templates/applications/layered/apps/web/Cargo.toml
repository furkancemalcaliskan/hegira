[package]
name = "app_web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
identity_leptos.workspace = true
leptos_support.workspace = true
icons.workspace = true
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
web-sys = { version = "0.3.91", features = ["Document", "DomTokenList", "Element", "Storage", "Window"] }

[features]
default = ["{{database_feature}}"]
db-postgres = ["identity_leptos/db-postgres"]
db-sqlite = ["identity_leptos/db-sqlite"]
hydrate = ["identity_leptos/hydrate", "leptos_support/hydrate", "leptos/hydrate"]
ssr = [
    "identity_leptos/ssr",
    "leptos_support/ssr",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]
wasm-split = ["identity_leptos/wasm-split"]
