[package]
name = "app_server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "app_server"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
app_application.workspace = true
app_application_contracts.workspace = true
app_domain.workspace = true
app_domain_shared.workspace = true
app_infrastructure = { workspace = true, optional = true }
app_presentation = { workspace = true, optional = true }
app_web = { workspace = true }
application = { workspace = true, optional = true }
application_contracts.workspace = true
background_jobs = { workspace = true, optional = true }
configuration = { workspace = true, optional = true }
domain.workspace = true
domain_shared.workspace = true
http_support = { workspace = true, optional = true }
identity_http = { workspace = true, optional = true }
identity_leptos = { workspace = true, optional = true }
identity_sqlx = { workspace = true, optional = true }
infrastructure = { workspace = true, optional = true }
observability = { workspace = true, optional = true }
persistence = { workspace = true, optional = true }
platform_core = { workspace = true, optional = true }
presentation = { workspace = true, optional = true }
runtime = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
leptos.workspace = true
leptos_axum = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[features]
default = ["db-sqlite"]
db-postgres = [
    "app_infrastructure/db-postgres",
    "app_presentation/db-postgres",
    "app_web/db-postgres",
    "background_jobs/db-postgres",
    "identity_http/db-postgres",
    "identity_sqlx/db-postgres",
    "infrastructure/db-postgres",
    "persistence/db-postgres",
    "presentation/db-postgres",
    "sqlx/postgres",
]
db-sqlite = [
    "app_infrastructure/db-sqlite",
    "app_presentation/db-sqlite",
    "app_web/db-sqlite",
    "background_jobs/db-sqlite",
    "identity_http/db-sqlite",
    "identity_sqlx/db-sqlite",
    "infrastructure/db-sqlite",
    "persistence/db-sqlite",
    "presentation/db-sqlite",
    "sqlx/sqlite",
]
hydrate = [
    "app_web/hydrate",
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
]
ssr = [
    "app_web/ssr",
    "application/ssr",
    "infrastructure/ssr",
    "identity_leptos/ssr",
    "presentation/ssr",
    "leptos/ssr",
    "dep:app_infrastructure",
    "dep:app_presentation",
    "dep:application",
    "dep:axum",
    "dep:background_jobs",
    "dep:configuration",
    "dep:http_support",
    "dep:identity_http",
    "dep:identity_leptos",
    "dep:identity_sqlx",
    "dep:infrastructure",
    "dep:leptos_axum",
    "dep:observability",
    "dep:persistence",
    "dep:platform_core",
    "dep:presentation",
    "dep:runtime",
    "dep:serde",
    "dep:sqlx",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
]
openapi = ["ssr", "application_contracts/openapi", "identity_http/openapi"]
wasm-split = ["app_web/wasm-split"]
cache-redis = ["ssr", "infrastructure/cache-redis", "http_support/cache-redis"]
metrics-prometheus = ["ssr", "observability/metrics-prometheus", "presentation/metrics-prometheus"]
otel-otlp = ["ssr", "app_infrastructure/otel-otlp", "http_support/otel-otlp", "observability/otel-otlp"]
search-meilisearch = ["ssr", "infrastructure/search-meilisearch"]
storage-s3 = ["ssr", "infrastructure/storage-s3"]
mailer-smtp = ["ssr", "infrastructure/mailer-smtp"]

[dev-dependencies]
http-body-util = "0.1.3"
serde_json = "1.0.145"
tower = { version = "0.5.3", features = ["util"] }

[package.metadata.leptos]
output-name = "app"
bin-target = "app_server"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "../web/src/style/main.css"
tailwind-input-file = "../web/src/style/tailwind.css"
assets-dir = "../web/src/public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
