[package]
name = "app_server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "app_server"

[dependencies]
app_application.workspace = true
app_application_contracts.workspace = true
app_domain.workspace = true
app_domain_shared.workspace = true
app_infrastructure = { workspace = true }
app_presentation = { workspace = true }
configuration.workspace = true
observability.workspace = true
persistence.workspace = true
platform_core.workspace = true
runtime.workspace = true
axum.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
default = ["db-sqlite"]
db-postgres = [
    "app_infrastructure/db-postgres",
    "app_presentation/db-postgres",
    "persistence/db-postgres",
]
db-sqlite = [
    "app_infrastructure/db-sqlite",
    "app_presentation/db-sqlite",
    "persistence/db-sqlite",
]
otel-otlp = [
    "app_infrastructure/otel-otlp",
    "observability/otel-otlp",
]
