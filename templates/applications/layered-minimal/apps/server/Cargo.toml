[package]
name = "app_server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "app_server"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
app_infrastructure = { workspace = true, optional = true }
app_presentation = { workspace = true, optional = true }
app_web.workspace = true
configuration = { workspace = true, optional = true }
http_support = { workspace = true, optional = true }
persistence = { workspace = true, optional = true }
runtime = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
leptos.workspace = true
leptos_axum = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[features]
default = ["{{database_feature}}"]
db-postgres = [
    "app_infrastructure/db-postgres",
    "app_presentation/db-postgres",
    "app_web/db-postgres",
    "persistence/db-postgres",
]
db-sqlite = [
    "app_infrastructure/db-sqlite",
    "app_presentation/db-sqlite",
    "app_web/db-sqlite",
    "persistence/db-sqlite",
]
hydrate = [
    "app_web/hydrate",
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
]
ssr = [
    "app_web/ssr",
    "leptos/ssr",
    "dep:app_infrastructure",
    "dep:app_presentation",
    "dep:axum",
    "dep:configuration",
    "dep:http_support",
    "dep:leptos_axum",
    "dep:persistence",
    "dep:runtime",
    "dep:serde",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
]
openapi = ["ssr", "app_presentation/openapi"]
wasm-split = ["app_web/wasm-split"]

[package.metadata.leptos]
output-name = "app"
bin-target = "app_server"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "../web/src/style/main.css"
tailwind-input-file = "../web/src/style/tailwind.css"
assets-dir = "../web/src/public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"

