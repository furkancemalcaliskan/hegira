[package]
name = "identity_http"
version = "0.8.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
axum = "0.8.9"
http_support = { path = "../../../crates/http_support" }
identity_application = { path = "../application", features = ["ssr"] }
identity_application_contracts = { path = "../application_contracts" }
leptos_support = { path = "../../../crates/leptos_support", features = ["ssr"] }
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"
utoipa = { version = "6.0.0", features = ["chrono", "uuid"], optional = true }
uuid = { version = "1.23.2", features = ["v4", "serde", "js"] }

[features]
default = ["db-postgres", "db-sqlite"]
db-postgres = []
db-sqlite = []
ssr = []
openapi = [
    "dep:utoipa",
    "dep:utoipa-swagger-ui-vendored",
    "dep:zip",
    "identity_application_contracts/openapi",
]

[build-dependencies]
utoipa-swagger-ui-vendored = { version = "=0.2.0", optional = true }
zip = { version = "9.0.4", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
http-body-util = "0.1.3"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
