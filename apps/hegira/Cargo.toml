[package]
name = "hegira"
version = "0.3.0"
edition = "2024"
default-run = "hegira"
authors = ["Furkan Cemal Caliskan <github.chant290@passinbox.com>"]
license = "Apache-2.0"
description = "A web application completely written in Rust"
readme = "../../README.md"
rust-version = "1.96"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
application = { path = "../../crates/application", optional = true }
application_contracts = { path = "../../crates/application_contracts" }
background_jobs = { path = "../../crates/background_jobs", optional = true }
cache = { path = "../../crates/cache", optional = true }
configuration = { path = "../../crates/configuration", optional = true }
domain = { path = "../../crates/domain" }
domain_shared = { path = "../../crates/domain_shared" }
infrastructure = { path = "../../crates/infrastructure", optional = true, default-features = false }
http_support = { path = "../../crates/http_support", optional = true, default-features = false }
identity_http = { path = "../../modules/identity/http", optional = true, default-features = false }
identity_leptos = { path = "../../modules/identity/leptos", optional = true, default-features = false }
identity_sqlx = { path = "../../modules/identity/sqlx", optional = true, default-features = false }
observability = { path = "../../crates/observability", optional = true, default-features = false }
platform_core = { path = "../../crates/platform_core", optional = true }
persistence = { path = "../../crates/persistence", optional = true, default-features = false }
presentation = { path = "../../crates/presentation", optional = true, default-features = false }
search = { path = "../../crates/search", optional = true, default-features = false }
storage = { path = "../../crates/storage", optional = true, default-features = false }
runtime = { path = "../../crates/runtime", optional = true, default-features = false }
test_support = { path = "../../crates/test_support", optional = true }
web = { path = "../../crates/web", default-features = false }
leptos = { version = "0.8.19" }
axum = { version = "0.8.9", optional = true }
leptos_axum = { version = "0.8.9", optional = true }
mail = { path = "../../crates/mail", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "migrate", "chrono", "uuid"], optional = true }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "fs", "signal"], optional = true }
tower-http = { version = "0.7.0", features = ["compression-br", "compression-gzip", "cors", "limit", "timeout"], optional = true }
tracing = { version = "0.1.44", optional = true }

# Client dependencies
console_error_panic_hook = { version = "0.1.7", optional = true }
wasm-bindgen = { version = "0.2.114", optional = true }

[features]
default = ["db-postgres", "db-sqlite"]
db-postgres = ["background_jobs/db-postgres", "identity_http/db-postgres", "identity_sqlx/db-postgres", "infrastructure/db-postgres", "persistence/db-postgres", "presentation/db-postgres", "search/db-postgres", "web/db-postgres", "sqlx/postgres"]
db-sqlite = ["background_jobs/db-sqlite", "identity_http/db-sqlite", "identity_sqlx/db-sqlite", "infrastructure/db-sqlite", "persistence/db-sqlite", "presentation/db-sqlite", "search/db-sqlite", "web/db-sqlite", "sqlx/sqlite"]
hydrate = [
    "web/hydrate",
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
]
ssr = [
    "dep:application",
    "dep:axum",
    "dep:background_jobs",
    "dep:cache",
    "dep:configuration",
    "dep:infrastructure",
    "dep:http_support",
    "dep:identity_http",
    "dep:identity_leptos",
    "dep:identity_sqlx",
    "dep:leptos_axum",
    "dep:mail",
    "dep:observability",
    "dep:persistence",
    "dep:platform_core",
    "dep:presentation",
    "dep:runtime",
    "dep:search",
    "dep:serde",
    "dep:sqlx",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
    "dep:storage",
    "application/ssr",
    "infrastructure/ssr",
    "identity_leptos/ssr",
    "presentation/ssr",
    "web/ssr",
    "leptos/ssr",
]
openapi = ["ssr", "application_contracts/openapi", "identity_http/openapi"]
wasm-split = ["web/wasm-split"]
cache-redis = ["ssr", "cache/redis", "infrastructure/cache-redis", "http_support/cache-redis"]
metrics-prometheus = ["ssr", "observability/metrics-prometheus", "presentation/metrics-prometheus"]
otel-otlp = ["ssr", "http_support/otel-otlp", "observability/otel-otlp"]
search-meilisearch = ["ssr", "search/meilisearch"]
storage-s3 = ["ssr", "storage/s3"]
mailer-smtp = ["ssr", "mail/smtp"]
test-support = ["ssr", "dep:test_support"]

[dev-dependencies]
axum = "0.8.9"
chrono = { version = "0.4.44", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "migrate", "chrono", "uuid"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.3"
test_support = { path = "../../crates/test_support" }
uuid = { version = "1.23.2", features = ["v4", "serde", "js"] }

[package.metadata.leptos]
output-name = "hegira"
bin-target = "hegira"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "../../crates/web/src/style/main.css"
tailwind-input-file = "../../crates/web/src/style/tailwind.css"
assets-dir = "../../crates/web/src/public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
