[package]
name = "hegira"
version = "0.2.0"
edition = "2024"
default-run = "hegira"
authors = ["Furkan Cemal Caliskan <github.chant290@passinbox.com>"]
license = "Apache-2.0"
description = "A web application completely written in Rust"
readme = "../../README.md"
rust-version = "1.96"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
application = { path = "../../crates/application", optional = true }
application_contracts = { path = "../../crates/application_contracts" }
configuration = { path = "../../crates/configuration", optional = true }
domain = { path = "../../crates/domain" }
domain_shared = { path = "../../crates/domain_shared" }
infrastructure = { path = "../../crates/infrastructure", optional = true, default-features = false }
platform_core = { path = "../../crates/platform_core", optional = true }
presentation = { path = "../../crates/presentation", optional = true, default-features = false }
runtime = { path = "../../crates/runtime", optional = true, default-features = false }
web = { path = "../../crates/web", default-features = false }
leptos = { version = "0.8.19" }
axum = { version = "0.8.9", optional = true }
leptos_axum = { version = "0.8.9", optional = true }
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "grpc-tonic", "http-proto", "reqwest-blocking-client", "tls-ring", "tls-roots"], optional = true }
opentelemetry_sdk = { version = "0.32.0", features = ["trace", "rt-tokio"], optional = true }
prometheus = { version = "0.14.0", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "migrate", "chrono", "uuid"], optional = true }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "fs", "signal"], optional = true }
tower-http = { version = "0.7.0", features = ["compression-br", "compression-gzip", "cors", "limit", "timeout"], optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-opentelemetry = { version = "0.33.0", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }

# Client dependencies
console_error_panic_hook = { version = "0.1.7", optional = true }
wasm-bindgen = { version = "0.2.114", optional = true }

[features]
default = ["db-postgres", "db-sqlite"]
db-postgres = ["infrastructure/db-postgres", "presentation/db-postgres", "web/db-postgres", "sqlx/postgres"]
db-sqlite = ["infrastructure/db-sqlite", "presentation/db-sqlite", "web/db-sqlite", "sqlx/sqlite"]
hydrate = [
    "web/hydrate",
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
]
ssr = [
    "dep:application",
    "dep:axum",
    "dep:configuration",
    "dep:infrastructure",
    "dep:leptos_axum",
    "dep:platform_core",
    "dep:presentation",
    "dep:runtime",
    "dep:serde",
    "dep:sqlx",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "application/ssr",
    "infrastructure/ssr",
    "presentation/ssr",
    "web/ssr",
    "leptos/ssr",
]
openapi = ["ssr", "application_contracts/openapi", "presentation/openapi"]
wasm-split = ["web/wasm-split"]
cache-redis = ["ssr", "infrastructure/cache-redis", "presentation/cache-redis"]
metrics-prometheus = ["ssr", "dep:prometheus", "presentation/metrics-prometheus"]
otel-otlp = ["ssr", "dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry", "presentation/otel-otlp"]
search-meilisearch = ["ssr", "infrastructure/search-meilisearch"]
storage-s3 = ["ssr", "infrastructure/storage-s3"]
mailer-smtp = ["ssr", "infrastructure/mailer-smtp"]
test-support = ["ssr", "application/test-support", "infrastructure/test-support"]

[dev-dependencies]
axum = "0.8.9"
chrono = { version = "0.4.44", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "migrate", "chrono", "uuid"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.3"
uuid = { version = "1.23.2", features = ["v4", "serde", "js"] }

[package.metadata.leptos]
output-name = "hegira"
bin-target = "hegira"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "../../crates/web/src/style/main.css"
tailwind-input-file = "../../crates/web/src/style/tailwind.css"
assets-dir = "../../crates/web/src/public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
