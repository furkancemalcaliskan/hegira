services:
  postgres:
    image: postgres:17-alpine
    container_name: hegira-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hegira
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./crates/infrastructure/src/db/scripts/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hegira"]
      interval: 5s
      timeout: 5s
      retries: 10

  tempo:
    image: grafana/tempo:2.10.5
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./ops/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  meilisearch:
    image: getmeili/meilisearch:v1.45.1
    profiles: ["search"]
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: local-development-search-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilisearch-data:/meili_data

  redis:
    image: redis:8-alpine
    profiles: ["distributed"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["mail"]
    ports: ["1025:1025", "8025:8025"]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
    profiles: ["storage"]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

volumes:
  postgres-data:
  tempo-data:
  meilisearch-data:
  minio-data:
