[workspace]
resolver = "3"
members = [
    "apps/hegira",
    "crates/platform_core",
    "crates/configuration",
    "crates/domain_shared",
    "crates/domain",
    "crates/application_contracts",
    "crates/application",
    "crates/infrastructure",
    "crates/presentation",
    "crates/web",
    "crates/db_migrator",
    "crates/runtime",
]
default-members = ["apps/hegira"]

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
debug = 0
panic = "abort"
strip = "symbols"
