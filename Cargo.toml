[workspace]
resolver = "3"
members = [
    "apps/hegira",
    "crates/platform_core",
    "crates/audit",
    "crates/cache",
    "crates/configuration",
    "crates/mail",
    "crates/persistence",
    "crates/search",
    "crates/security",
    "crates/settings",
    "crates/storage",
    "crates/background_jobs",
    "crates/http_support",
    "crates/leptos_support",
    "crates/observability",
    "crates/test_support",
    "crates/domain_shared",
    "crates/domain",
    "crates/application_contracts",
    "crates/application",
    "crates/infrastructure",
    "crates/presentation",
    "crates/web",
    "crates/db_migrator",
    "crates/runtime",
    "modules/identity/domain_shared",
    "modules/identity/domain",
    "modules/identity/application_contracts",
    "modules/identity/application",
    "modules/identity/sqlx",
    "modules/identity/http",
    "modules/identity/leptos",
    "tools/template_renderer",
]
default-members = ["apps/hegira"]

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
debug = 0
panic = "abort"
strip = "symbols"
